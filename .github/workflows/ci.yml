name: CI

# Runs the one self-check that exists in this repo today:
#
#   python3 design/netlist.py --check
#
# (design/netlist.py's own module docstring documents exactly what this
# verifies: the committed design/netlist/*.spice reproduce byte-for-byte
# from design/*.sch, xschem's own ERC is clean, and the ldo_core pinout /
# symbol-vs-schematic invariants hold.)
#
# Unlike 2AMLogic/gf180-ldo's ci.yml -- which splits a PDK-free
# `harness-selftest` job (runs on every push/PR) from a PDK-backed
# `pvt-smoke` job (gated to schedule/workflow_dispatch/an opt-in PR label,
# see 2AMLogic/gf180-ldo's own ci.yml) -- this repo has no PDK-free tier to
# split off: `design/netlist.py --check` inherently needs xschem plus a real
# ihp-sg13g2 install to do anything at all (it re-runs the xschem export and
# diffs the result), and no sim/ harness exists yet (sim/ is still an empty
# placeholder -- see sim/README.md). So the check below runs on every push
# to main and every pull request, not gated: gating it would mean CI checks
# nothing on an ordinary PR, which defeats this issue's whole point (a
# schematic edit that forgets to re-run the export, or that breaks ERC,
# should fail loudly on the PR that introduces it, not wait for a nightly
# job). The IHP-Open-PDK fetch (~350 MB, pinned to v0.3.0, checksum-verified
# by 2AMLogic/klayout-tools' own fetch script) is cached across runs via
# actions/cache to keep the steady-state cost low.
#
# sim/ now has one landed deck (sim/pass-device-screening/, issue #13): the
# `pass-device-screening-check` job below runs its `run_sweep.sh --check-env`
# mode -- a syntax check of one generated netlist per bench via `ngspice -b`,
# NOT the full 120-point corner sweep. Per sim/README.md "CI: syntax/
# --check-env only, never a records/ entry": CI checks that the deck still
# parses; it never mints append-only evidence. That stays a human/agent
# action run locally against a real PDK + OSDI install (sim/pass-device-
# screening/README.md "Cold-start reproduction").
#
# Explicitly excluded from CI (not "checks" yet, so nothing to wire up):
#   - No linter/formatter is configured for this repo yet (package.json's
#     `lint`/`check:ci` scripts are honest "not configured" placeholders);
#     add a CI job for either if/when one is adopted.
#
# xschem is built from source (pinned to 3.4.7), not apt-installed: Ubuntu
# 24.04's apt package (xschem 3.4.4-1) has a `top_is_subckt` regression --
# it emits a double-comment-prefixed `**.subckt`/`**.ends` wrapper for the
# top-of-invocation cell instead of an active one, even though
# design/xschemrc sets `top_is_subckt 1`. netlist.py netlists every cell
# individually (each cell is the "top of invocation" for its own xschem
# run), so every cell hits this, and `--check` fails on an unmodified
# worktree with `.subckt <cell> not found in its own netlist`. This is the
# same regression and fix 2AMLogic/gf180-temp-por hit and fixed (its own
# issue #89 / PR #95) -- see design/README.md's Requirements note for the
# full root cause and the xschem >= 3.4.7 version floor this repo now
# states explicitly.
#
# ngspice is likewise built from source (pinned to 46), for the same
# shape of reason: Ubuntu 24.04's apt package is ngspice 42
# (42+ds-3build1), whose OSDI loader only accepts ABI **v0.3**, while
# sim/tools/build-osdi.sh's checksum-pinned OpenVAF-Reloaded v24.0.1mob
# emits ABI **v0.4**. Every PDK model therefore fails to load under the
# apt package ("NGSPICE only supports OSDI v0.3 but ... targets v0.4!"),
# deterministically -- there is no ngspice on any current Ubuntu LTS that
# can run this deck. 46 is not an arbitrary newer pick: it is the exact
# version this tree's committed evidence was generated with
# (sim/pdk.json "ngspice_actually_used": "ngspice-46"), so CI's simulator
# and the recorded evidence's simulator are the same build. See
# sim/README.md "OSDI device models" for the version floor.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# The IHP-Open-PDK version this workflow fetches and pins its cache key to.
# Keep in sync with 2AMLogic/klayout-tools' scripts/fetch-ihp-sg13g2.sh
# (IHP_OPEN_PDK_VERSION) and spec/porting-plan.md's own v0.3.0 references.
env:
  IHP_OPEN_PDK_VERSION: "0.3.0"
  # Pin the klayout-tools ref this workflow checks out its PDK-fetch script
  # from, so a future klayout-tools change can't silently alter this repo's
  # CI. Bump deliberately, alongside IHP_OPEN_PDK_VERSION above if the two
  # move together.
  KLAYOUT_TOOLS_REF: "v0.3.0"

jobs:
  netlist-check:
    name: design/netlist.py --check (xschem + ihp-sg13g2 PDK)
    runs-on: ubuntu-latest
    steps:
      - name: Check out sg13g2-ldo
        uses: actions/checkout@v4

      - name: Check out klayout-tools (pinned, for its PDK fetch script only)
        uses: actions/checkout@v4
        with:
          repository: 2AMLogic/klayout-tools
          ref: ${{ env.KLAYOUT_TOOLS_REF }}
          path: klayout-tools

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and install xschem 3.4.7 from source (top_is_subckt regression)
        # Ubuntu 24.04's apt package (3.4.4-1) mis-handles top_is_subckt --
        # see this workflow's own header comment and design/README.md for
        # the full root cause. No known-good newer apt/PPA package exists
        # as of this writing, so pin by building from source instead.
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcairo2-dev libx11-dev \
            libxpm-dev tcl8.6-dev tk8.6-dev
          curl -sL https://github.com/StefanSchippers/xschem/archive/refs/tags/3.4.7.tar.gz \
            -o /tmp/xschem-3.4.7.tar.gz
          tar xzf /tmp/xschem-3.4.7.tar.gz -C /tmp
          (cd /tmp/xschem-3.4.7 && ./configure && make -j"$(nproc)" && sudo make install)
          xschem --version | grep -q 'XSCHEM V3.4.7' || {
            echo "expected xschem 3.4.7, got:" >&2
            xschem --version >&2
            exit 1
          }

      - name: Cache IHP-Open-PDK fetch
        id: pdk-cache
        uses: actions/cache@v4
        with:
          path: klayout-tools/pdks/ihp-open-pdk
          key: ihp-open-pdk-v${{ env.IHP_OPEN_PDK_VERSION }}

      - name: Fetch ihp-sg13g2 PDK (IHP-Open-PDK, pinned + checksum-verified)
        run: klayout-tools/scripts/fetch-ihp-sg13g2.sh

      - name: design/netlist.py --check
        env:
          PDK_ROOT: ${{ github.workspace }}/klayout-tools/pdks/ihp-open-pdk
          PDK: ihp-sg13g2
        run: python3 design/netlist.py --check -v

  pass-device-screening-check:
    name: sim/pass-device-screening run_sweep.sh --check-env (ngspice + ihp-sg13g2 PDK)
    runs-on: ubuntu-latest
    steps:
      - name: Check out sg13g2-ldo
        uses: actions/checkout@v4

      - name: Check out klayout-tools (pinned, for its PDK fetch script only)
        uses: actions/checkout@v4
        with:
          repository: 2AMLogic/klayout-tools
          ref: ${{ env.KLAYOUT_TOOLS_REF }}
          path: klayout-tools

      - name: Build and install ngspice 46 from source (OSDI ABI v0.4)
        # Ubuntu 24.04's apt ngspice (42) only supports OSDI ABI v0.3 and so
        # cannot load the v0.4 models sim/tools/build-osdi.sh produces -- see
        # this workflow's own header comment for the full root cause. Pin the
        # same ngspice sim/pdk.json records as generating this tree's
        # evidence ("ngspice_actually_used": "ngspice-46"), from a
        # checksum-verified upstream tarball; same
        # build-from-source-because-the-distro-package-is-wrong pattern as
        # the xschem 3.4.7 build in netlist-check above.
        #
        # Checksum re-derived from the upstream tarball and independently
        # cross-checked against Homebrew's own ngspice 46 formula pin
        # (Homebrew/homebrew-core 316c49b7, Formula/n/ngspice.rb).
        env:
          NGSPICE_VERSION: "46"
          NGSPICE_SHA256: "a0d1699af1940b06649276dcd6ff5a566c8c0cad01b2f7b5e99dedbb4d64c19b"
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/ngspice.tar.gz \
            "https://downloads.sourceforge.net/project/ngspice/ng-spice-rework/old-releases/${NGSPICE_VERSION}/ngspice-${NGSPICE_VERSION}.tar.gz"
          echo "${NGSPICE_SHA256}  /tmp/ngspice.tar.gz" | sha256sum -c -
          tar xzf /tmp/ngspice.tar.gz -C /tmp
          # OSDI is on by default (configure exposes --disable-osdi, not
          # --enable-osdi); X11 and readline are dead weight for a batch
          # -b run in CI.
          (cd "/tmp/ngspice-${NGSPICE_VERSION}" \
            && ./configure --without-x --with-readline=no --disable-debug \
            && make -j"$(nproc)" \
            && sudo make install)
          sudo ldconfig
          ngspice --version | grep -q "ngspice-${NGSPICE_VERSION} " || {
            echo "expected ngspice-${NGSPICE_VERSION}, got:" >&2
            ngspice --version >&2
            exit 1
          }

      - name: Cache IHP-Open-PDK fetch
        id: pdk-cache
        uses: actions/cache@v4
        with:
          path: klayout-tools/pdks/ihp-open-pdk
          key: ihp-open-pdk-v${{ env.IHP_OPEN_PDK_VERSION }}

      - name: Fetch ihp-sg13g2 PDK (IHP-Open-PDK, pinned + checksum-verified)
        run: klayout-tools/scripts/fetch-ihp-sg13g2.sh

      # Cache the OSDI compiler download + build output separately from the
      # PDK fetch above -- see sim/tools/build-osdi.sh's own header for full
      # provenance (checksum-pinned OpenVAF-Reloaded, PDK's own Verilog-A
      # sources). Keyed on the PDK version + this script's own hash so a
      # future compiler/pin bump invalidates the cache automatically.
      - name: Cache OSDI compiler download
        uses: actions/cache@v4
        with:
          path: ~/.cache/sg13g2-ldo
          key: sg13g2-ldo-osdi-${{ env.IHP_OPEN_PDK_VERSION }}-${{ hashFiles('sim/tools/build-osdi.sh') }}

      - name: Build OSDI device models
        env:
          PDK_ROOT: ${{ github.workspace }}/klayout-tools/pdks/ihp-open-pdk
          PDK: ihp-sg13g2
        run: sim/tools/build-osdi.sh

      - name: sim/pass-device-screening run_sweep.sh --check-env
        env:
          PDK_ROOT: ${{ github.workspace }}/klayout-tools/pdks/ihp-open-pdk
          PDK: ihp-sg13g2
        run: sim/pass-device-screening/run_sweep.sh --check-env
